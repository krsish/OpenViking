memory_type: work_item
stage: user
enabled: true
operation_mode: upsert
peer_enabled: false
directory: "viking://user/{{ user_space }}/memories/work_item"
filename_template: "{{ work_item_id }}.md"
description: |
  Maintain a bounded current continuation state for a concrete piece of the user's work,
  shared across sessions. This is not an event log or a list of everything ever discussed.
  Use an existing page_id only after reading its canonical state and confirming the same
  goal and scope. Same title or topic alone is not identity; do not merge unrelated work.
  The server allocates immutable work_item IDs. Renaming or switching sessions keeps the ID.
  Apply only NEW conversation evidence when changing canonical work_item state. Prior WM
  and existing memory cannot override a newer canonical state. This restriction does not
  prevent resolving an already-settled continuation from its supplied state, as described
  below. Preserve still-valid constraints,
  unanswered user questions and commitments. Keep plan, attempted action, and verified
  result distinct. Tool evidence is evidence of execution, not a user preference.
  Account for this conversation's continuation information: update/create the relevant
  work_item when its state changes. Do not create a task solely to hold non-task continuation.
  For continuation not fully accounted for by a work_item, use sdk.continuation in Python or
  continuation_coverage in JSON. Maintain stable continuation items: use each supplied
  continuation_id with action keep (unchanged content plus a concrete retention reason),
  update (complete latest summary), resolve (reason explaining closure), or promote
  (specific work_item and reason). Use action
  create with summary only for a genuinely new matter; the server assigns its ID. Supply
  supporting ranges with new non-checkpoint evidence for create, update and promote.
  Ranges are optional for keep and resolve. Never recreate the previous items as a
  new round-by-round summary. Preserve unresolved questions,
  constraints and commitments even when another memory stores related facts. Keep all
  continuation within the configured token budget given in the output contract, including
  previous continuation and formatting. Partial tool previews may be attributed
  to work_items or continuation summaries/reasons. Coverage records where continuation
  information belongs; it does not certify every fact in the original output. Update state
  from visible evidence and the conversation, without inventing unseen results or treating
  a completed tool as a completed task. If an outcome is unclear, retain the pending
  verification and its reference. Original tool results remain in the session archive.
  New original messages not selected for work_items or continuation are archive_only:
  their complete original text stays in storage without being copied into working memory.
  Previous continuation items are background, not new user evidence, and are preserved
  by default under the same ID. Omission does not resolve them. keep retains an item in
  active working memory; resolve removes it only from active working memory, preserving
  its history and original evidence in the archive. Neither action deletes archive data.
  For keep, reason must identify
  a remaining request, still-valid constraint, continuing commitment, reference needed for
  ongoing work, or uncertainty that needs verification. A still-valid constraint requires
  retention even without a next action. Keep unchanged content without rewriting; update only
  with supporting new evidence and preserve all still-valid details.
  Progress, completed substeps, new phases and changed next actions within the same matter
  are updates under the same ID while any follow-up remains. Never resolve an old item and
  create a new item merely to express its progress. Review each item's current state together
  with new messages. Resolve only when all its obligations are settled and no applicable
  constraints or necessary continuation remain. The supplied item's already-settled state
  can justify resolve without any new evidence or ranges; explain that basis in reason.
  If completion or applicability is uncertain, keep and explain what needs verification.
  If a completed Q&A or delivery record has no remaining obligations or applicable constraints,
  emit resolve, even when no new messages concern it. "Keep for archival background" is not
  a valid keep reason: archiving is already done and does not require keeping the item active.
  The server may move idle, unprotected items to cold storage without resolving them.
  An unanswered question or unfinished action remains active even if temporary, low priority,
  without a deadline, or unprotected. Use keep without protection for such an unchanged item;
  leave cooling to the server. Lack of protection is not completion or cancellation evidence. Cite
  ranges of new related messages on keep or update to refresh activity. Repeating keep,
  rewriting a summary, reading history, or seeing the item in this prompt does not refresh
  it. Restore a supplied cold item only when new messages concern it: reuse its ID with
  keep or update and supporting new ranges. Resolve it instead if already settled.
  Register protection from idle eviction with optional protection={kind, reason, ranges}
  on create, update or keep: kind constraint for a still-applicable rule, pinned for the
  user's explicit instruction to keep attention on this item, or commitment for a promise
  needed by ongoing work or an approaching due date. Name its concrete reason and scope,
  and cite complete supporting non-checkpoint messages. Initial registration for an old
  item may cite all chunks of that item's own checkpoint. Register existing constraints
  this way instead of relying on a keep reason alone. Ordinary unfinished work or a vague
  keep reason does not warrant protection. Omit protection to preserve it; use kind none
  with current non-checkpoint evidence and reason to remove it when no longer applicable.
  Protection does not bypass the working-memory token budget.
  Promote only after updating or
  creating a work_item that preserves the complete item, with ranges including every
  source index of the old continuation (including all chunks) and the new evidence.
  Reading or activating the work_item alone cannot transfer the item. Reference it as
  work_item=the_binding in Python, or
  work_item_page_id in JSON. The server confirms its successful persistence before removal.
  A request to resume existing work needs an activation even if no state changed: select
  that already-read item with activate(ranges=...) in Python, or work_item_activations
  in JSON. Match the current request to its goal and scope, not its title alone. Candidate
  reads and search hits are background, never automatic activation. Do not invent an
  update just to activate; update fields only for genuinely new state evidence.
  Use complete concise string values for changed fields; an empty string explicitly clears
  a resolved optional field. Omitted/null fields retain their previous values. Resolve or
  replace stale steps and decisions, do not append a history of every round.
  All fields and the rendered body MUST fit within the configured per-work_item token budget
  given in the output contract, leaving room for headings. Current state is a short
  snapshot, next_action is the immediate next step, waiting_for includes the waiting party
  and release condition. Keep only currently useful references and decisions.
  status is open, in_progress, waiting, blocked, done, or cancelled. Do not mark a plan done
  without supporting results. Never delete work_items merely because they finished or
  became inactive. A completed/cancelled item changes status only on an explicit new user
  request: set reopen_reason to an exact quote from that request and include its ranges.
  Mere retrieval, similarity, an old instruction or offline consolidation cannot reopen it.
content_template: |
  # {{ title }}
  Status: {{ status }}
  Scope: {{ scope }}
  ## Goal
  {{ goal }}
  ## Current state
  {{ current_state }}
  ## Next action
  {{ next_action }}
  ## Constraints
  {{ constraints }}
  ## Waiting for
  {{ waiting_for }}
  ## Decisions
  {{ decisions }}
  ## References
  {{ refs }}
embedding_template: |
  {{ title }}
  {{ scope }}
  {{ goal }}
  {{ current_state }}
  {{ next_action }}
  {{ waiting_for }}
fields:
  - name: work_item_id
    type: string
    description: Server-assigned immutable work-item identity; never invent or change it.
    merge_op: immutable
  - name: title
    type: string
    description: Short distinctive name.
    merge_op: replace
  - name: scope
    type: string
    description: Project, repository or business object that disambiguates this work.
    merge_op: replace
  - name: goal
    type: string
    description: Current intended outcome and acceptance condition.
    merge_op: replace
  - name: status
    type: string
    description: "One of open, in_progress, waiting, blocked, done, cancelled."
    merge_op: replace
  - name: current_state
    type: string
    description: Latest confirmed progress and important evidence, not an action log.
    merge_op: replace
  - name: next_action
    type: string
    description: Immediate next action; empty when none remains.
    merge_op: replace
  - name: constraints
    type: string
    description: Still-valid requirements and constraints needed to continue.
    merge_op: replace
  - name: waiting_for
    type: string
    description: Unanswered questions, waiting party and release condition; clear after resolution.
    merge_op: replace
  - name: decisions
    type: string
    description: Current decisions with concise reasons; remove superseded details.
    merge_op: replace
  - name: refs
    type: string
    description: A few necessary file paths or resource/memory URIs with their purpose.
    merge_op: replace
  - name: ranges
    type: string
    description: Current conversation source indices, e.g. 0-3,7. Include only messages whose continuation information this state accounts for. Required with new conversation; empty only for offline consolidation.
    merge_op: replace
  - name: reopen_reason
    type: string
    description: Empty normally. To change a terminal status, quote the exact NEW user request authorizing reopening and include that message in ranges.
    merge_op: replace
